<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dschungel Memory</title>
<style>
*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
:root {
  --deep: #1a4f10; --mid: #2d7a1f; --mid2: #4f9c34; --light: #cdeab8; --foam: #f6fbf0;
  --accent: #ffd166; --accent2: #f4b63f; --coral: #e84444; --coral2: #f4a69f; --success: #4fa17a;
}
body { font-family:'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Trebuchet MS', sans-serif; background: linear-gradient(180deg, #f7fcef 0%, #e3f4cb 20%, #b9e293 42%, #8ccc63 62%, #5fab3f 82%, #458a2c 100%); min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:0 0 40px; position: relative; }

/* ---------- decorative jungle background: leafy fronds along the edges ---------- */
.jungle-bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
.leaf-deco {
  position: absolute;
  background: linear-gradient(135deg, var(--mid2), var(--deep));
  border-radius: 0% 100% 0% 100% / 0% 100% 0% 100%;
  box-shadow: 0 3px 8px rgba(10,40,5,0.25);
  opacity: 0.8;
}
.leaf-deco::after {
  content: ''; position: absolute; top: 10%; left: 50%; width: 2px; height: 78%;
  background: rgba(255,255,255,0.22); transform: translateX(-50%) rotate(-6deg);
}

.leaf-particle {
  position: absolute;
  top: -8vh;
  animation: leaf-fall linear infinite;
  opacity: 0;
  pointer-events: none;
}
.leaf-particle.glyph { filter: drop-shadow(0 2px 3px rgba(10,40,5,0.25)); }
.leaf-particle.dot { border-radius: 50%; background: var(--light); }

@keyframes leaf-fall {
  0%   { transform: translateY(0) translateX(0) rotate(0deg); opacity: 0; }
  8%   { opacity: 0.8; }
  25%  { transform: translateY(25vh) translateX(22px) rotate(50deg); }
  50%  { transform: translateY(50vh) translateX(-16px) rotate(-35deg); }
  75%  { transform: translateY(75vh) translateX(24px) rotate(65deg); }
  92%  { opacity: 0.7; }
  100% { transform: translateY(118vh) translateX(-12px) rotate(-20deg); opacity: 0; }
}

.game-bar { position: relative; z-index: 1; width:100%; max-width:490px; display:flex; align-items:center; justify-content:space-between; margin:4px 0 2px; padding:0 2px; }
#back-btn { display:none; background:rgba(255,255,255,.18); border:1px solid rgba(255,255,255,.35); color:var(--foam); font-family: inherit; font-size:14px; padding:6px 14px; border-radius:999px; cursor:pointer; }
#back-btn:hover { background:rgba(255,255,255,.32); }
#stats { display:none; font-size:15px; background:rgba(255,255,255,.18); color:var(--foam); padding:5px 14px; border-radius:999px; }

/* START */
#start { position: relative; z-index: 1; display:flex; flex-direction:column; align-items:center; gap:16px; padding:16px 20px; max-width:480px; width:100%; }
#start .logo { font-size:40px; margin-bottom:-6px; }
#start h2 { font-size:28px; color:var(--foam); text-align:center; text-shadow: 0 2px 6px rgba(0,0,0,0.3); }
#start p  { font-size:18px; color:var(--foam); text-align:center; line-height:1.5; opacity:0.92; }
.mode-btn { width:100%; background: linear-gradient(160deg, #ffffff, var(--foam)); border:3px solid var(--mid); border-radius:16px; padding:18px 20px; cursor:pointer; display:flex; align-items:center; gap:16px; transition:all .15s; text-align:left; box-shadow: 0 6px 0 var(--deep), 0 10px 16px rgba(0,0,0,0.25); }
.mode-btn:hover { transform:translateY(-2px); box-shadow: 0 8px 0 var(--deep), 0 14px 20px rgba(0,0,0,0.3); }
.mode-btn:active { transform:translateY(4px); box-shadow: 0 2px 0 var(--deep), 0 4px 8px rgba(0,0,0,0.2); }
.mode-btn .mode-icon  { font-size:36px; flex-shrink:0; }
.mode-btn .mode-title { font-size:22px; color:var(--deep); font-family: inherit; }
.mode-btn .mode-sub   { font-size:15px; color:#5a6e52; font-family: inherit; }

/* GAME */
#game { position: relative; z-index: 1; display:none; flex-direction:column; align-items:center; width:100%; max-width:490px; padding:16px; gap:16px; }

/* GRID */
#grid { display:grid; gap:10px; width:100%; }

/* CARD */
.card { aspect-ratio:3/4; cursor:pointer; perspective:700px; }
.card-inner { width:100%; height:100%; position:relative; transform-style:preserve-3d; transition:transform .45s ease; border-radius:12px; }
.card.flipped .card-inner,
.card.matched .card-inner { transform:rotateY(180deg); }
.card-back, .card-front { position:absolute; width:100%; height:100%; border-radius:12px; backface-visibility:hidden; -webkit-backface-visibility:hidden; overflow:hidden; }

/* BACK — Dschungelmuster mit Blatt-Icon */
.card-back {
  background:
    repeating-linear-gradient(60deg,  rgba(255,255,255,.08) 0px, rgba(255,255,255,.08) 3px, transparent 3px, transparent 22px),
    repeating-linear-gradient(120deg, rgba(255,255,255,.06) 0px, rgba(255,255,255,.06) 2px, transparent 2px, transparent 18px),
    linear-gradient(160deg, var(--mid2), var(--mid) 60%, var(--deep));
  border:3px solid var(--deep);
  display:flex; align-items:center; justify-content:center;
}
.card-back .leaf-icon { width:46%; height:46%; filter: drop-shadow(0 3px 5px rgba(0,0,0,0.3)); }

/* FRONT */
.card-front {
  transform:rotateY(180deg);
  background:#fff;
  border:3px solid var(--light);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:6px; gap:3px;
  transition:border-color .25s;
  text-align:center;
}
.card-front img { width:100%; flex:1; object-fit:cover; object-position:center 20%; border-radius:7px; min-height:0; display:block; }
.card-front img.pos-center { object-position:center center; }
.card-front img.pos-top    { object-position:center 15%; }
.card-front img.pos-right  { object-position:30% center; }
.card-front .lbl { font-size:clamp(12px,2vw,15px); color:var(--deep); text-align:center; line-height:1.2; padding:1px 3px 2px; font-weight:bold; }

.card-front.is-name { background:var(--foam); border-color:var(--mid); justify-content:center; }
.card-front.is-name .lbl { font-size:clamp(13px,2.4vw,19px); font-weight:bold; color:var(--deep); padding:6px; white-space:pre-line; }

.card.matched .card-front { border-color:var(--accent2); background:#fffde7; }
.card.wrong   .card-front { border-color:var(--coral) !important; }

/* WIN */
#win { position: relative; z-index: 1; display:none; flex-direction:column; align-items:center; gap:20px; padding:30px 20px; max-width:480px; width:100%; }
#win .trophy { font-size:80px; animation:bounce .6s ease; }
@keyframes bounce { 0%,100%{transform:translateY(0)} 40%{transform:translateY(-20px)} }
#win h2 { font-size:30px; color:var(--foam); text-align:center; text-shadow: 0 2px 6px rgba(0,0,0,0.3); }
#win .score-big { font-size:36px; color:var(--accent); }
#win .stars { font-size:50px; letter-spacing:4px; }
#win p { font-size:20px; color:var(--foam); text-align:center; opacity:0.92; }
.win-btn { background: linear-gradient(160deg, var(--accent), var(--accent2)); color:#4a3300; border:none; border-radius:14px; padding:16px 32px; font-family: inherit; font-size:22px; cursor:pointer; transition:all .15s; box-shadow: 0 5px 0 #c98f1f, 0 8px 16px rgba(0,0,0,0.25); }
.win-btn:hover { transform:translateY(-2px); }
.win-btn.sec { background: linear-gradient(160deg, #ffffff, var(--foam)); color:var(--deep); border:3px solid var(--foam); box-shadow: 0 5px 0 var(--deep), 0 8px 16px rgba(0,0,0,0.2); }
.win-btns { display:flex; gap:12px; flex-wrap:wrap; justify-content:center; }
</style>
</head>

<button id="back-to-hub-btn" onclick="history.back()" style="position:fixed;top:10px;left:10px;z-index:999;cursor:pointer;border:1px solid rgba(0,0,0,0.12);background:rgba(255,255,255,0.88);color:#333;padding:7px 14px;border-radius:999px;font-family:Verdana,Geneva,'Trebuchet MS',sans-serif;font-size:13px;font-weight:bold;box-shadow:0 2px 8px rgba(0,0,0,0.25);">← Zurück</button>


<div class="jungle-bg" id="jungle-bg"></div>

<div id="start">

  <h2>Dschungel Memory</h2>
  <p>Finde die passenden Paare: Bild und Name zusammen!</p>
  <button class="mode-btn" style="background:#e3f3d6;border-color:#2d7a1f" onclick="startGame(6)">

    <div><div class="mode-title">Niveau 1</div><div class="mode-sub">6 Paare — 12 Karten</div></div>

  <button class="mode-btn" style="background:#fff3d6;border-color:#f4b63f" onclick="startGame(8)">

  </button>
  <button class="mode-btn" style="background:#fde4e1;border-color:#e84444" onclick="startGame(10)">
    <span class="mode-icon">🌴</span>
    <div><div class="mode-title">Niveau 3</div><div class="mode-sub">10 Paare — 20 Karten</div></div>
  </button>
</div>

<div id="game">
  <div class="game-bar">
    <button id="back-btn" onclick="showStart()">← Zurück</button>
    <div id="stats">0 Paare</div>
  </div>
  <div id="grid"></div>
</div>

<div id="win">

  <h2 id="win-title"></h2>
  <div class="score-big" id="win-score"></div>
  <div class="stars" id="win-stars"></div>
  <p id="win-msg"></p>
  <div class="win-btns">
    <button class="win-btn sec" onclick="showStart()">🏠 Startseite</button>
    <button class="win-btn" onclick="restartSame()">🔄 Nochmal</button>
  </div>
</div>

<script>
let pairCount=6, flipped=[], matched=0, moves=0, locked=false, usedNames=[];

function shuffle(a){
  const b=[...a];
  for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}
  return b;
}

function showStart(){
  document.getElementById('game').style.display='none';
  document.getElementById('win').style.display='none';
  document.getElementById('start').style.display='flex';
  document.getElementById('back-btn').style.display='none';
  document.getElementById('stats').style.display='none';
  document.getElementById('stats').textContent='0 Paare';
}

function restartSame(){ startGame(pairCount); }

function startGame(n){
  pairCount=n; flipped=[]; matched=0; moves=0; locked=false;

  const fresh = ALLE_TIERE.filter(t => !usedNames.includes(t.name));
  const pool  = fresh.length >= n ? fresh : ALLE_TIERE;
  const sel   = shuffle(pool).slice(0, n);
  usedNames   = sel.map(t=>t.name);

  const cards = shuffle([
    ...sel.map((t,i)=>({id:i, type:'image', tier:t})),
    ...sel.map((t,i)=>({id:i, type:'name',  tier:t})),
  ]);

  document.getElementById('start').style.display='none';
  document.getElementById('win').style.display='none';
  document.getElementById('game').style.display='flex';
  document.getElementById('back-btn').style.display='block';
  document.getElementById('stats').style.display='block';

  const cols = n===10 ? 5 : 4;
  // N2 etwas kleiner
  const gameEl = document.getElementById('game');
  gameEl.style.maxWidth = n===8 ? '430px' : '490px';
  const grid = document.getElementById('grid');
  grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
  grid.innerHTML='';

  cards.forEach(cd=>{
    const card=document.createElement('div');
    card.className='card';
    card.dataset.id=cd.id;
    card.dataset.type=cd.type;

    const inner=document.createElement('div');
    inner.className='card-inner';

    const back=document.createElement('div');
    back.className='card-back';
    back.innerHTML='<svg class="leaf-icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><path d="M50 10 C75 18 88 42 80 65 C72 88 50 92 50 92 C50 92 28 88 20 65 C12 42 25 18 50 10 Z" fill="#eafbe0" opacity="0.92"/><path d="M50 16 L50 90" stroke="#4f9c34" stroke-width="3" stroke-linecap="round"/><path d="M50 32 L34 24 M50 48 L30 42 M50 64 L32 60 M50 32 L66 24 M50 48 L70 42 M50 64 L68 60" stroke="#4f9c34" stroke-width="2.5" stroke-linecap="round" fill="none"/></svg>';

    const front=document.createElement('div');
    front.className='card-front'+(cd.type==='name'?' is-name':'');

    if(cd.type==='image'){
      const img=document.createElement('img');
      img.src=cd.tier.src;
      img.alt=cd.tier.name;
      // Tiere bei denen das Gesicht/Körper eher mittig ist
      const centerTiere = ['Gorilla','Orang-Utan','Harpyie'];
      const rightTiere  = ['Tiger','Jaguar','Tapir','Tukan'];
      const topTiere    = ['Schwarze Mamba'];
      if(centerTiere.includes(cd.tier.name)) img.classList.add('pos-center');
      else if(rightTiere.includes(cd.tier.name)) img.classList.add('pos-right');
      else if(topTiere.includes(cd.tier.name)) img.classList.add('pos-top');
      front.appendChild(img);
      const lbl=document.createElement('div');
      lbl.className='lbl';
      lbl.textContent='';
      front.appendChild(lbl);
    } else {
      const lbl=document.createElement('div');
      lbl.className='lbl';
      lbl.textContent=cd.tier.name==='Pfeilgiftfrosch' ? 'Pfeilgift-\nfrosch' : cd.tier.name;
      front.appendChild(lbl);
    }

    inner.appendChild(back);
    inner.appendChild(front);
    card.appendChild(inner);
    card.addEventListener('click',()=>flipCard(card));
    grid.appendChild(card);
  });

  updateStats();
}

function flipCard(card){
  if(locked||card.classList.contains('flipped')||card.classList.contains('matched')) return;
  if(flipped.length>=2) return;
  card.classList.add('flipped');
  flipped.push(card);
  if(flipped.length===2){ moves++; locked=true; setTimeout(checkMatch,500); }
}

function checkMatch(){
  const [a,b]=flipped;
  const ok=a.dataset.id===b.dataset.id && a.dataset.type!==b.dataset.type;
  if(ok){
    a.classList.add('matched');
    b.classList.add('matched');
    [a,b].forEach(c=>{ if(c.dataset.type==='image') c.querySelector('.lbl').textContent=c.querySelector('img').alt; });
    matched++;
    updateStats();
    flipped=[]; locked=false;
    if(matched===pairCount) setTimeout(showWin,400);
  } else {
    a.classList.add('wrong');
    b.classList.add('wrong');
    setTimeout(()=>{
      a.classList.remove('wrong','flipped');
      b.classList.remove('wrong','flipped');
      flipped=[]; locked=false;
    }, 900);
  }
}

function updateStats(){
  document.getElementById('stats').textContent=`${matched} / ${pairCount} Paare`;
}

function showWin(){
  document.getElementById('game').style.display='none';
  document.getElementById('win').style.display='flex';
  const r=moves/pairCount;
  let stars,title,msg;
  if     (r<=1.4){stars='⭐⭐⭐';title='Perfektes Gedächtnis! 🌴';msg=`Nur ${moves} Versuche — unglaublich!`;}
  else if(r<=2.0){stars='⭐⭐'; title='Super gemacht! 🦜';        msg=`${moves} Versuche — sehr gut!`;}
  else if(r<=3.0){stars='⭐';  title='Gut versucht! 🌿';         msg=`${moves} Versuche — beim nächsten Mal noch besser!`;}
  else           {stars='';    title='Geschafft! 🐸';             msg=`${moves} Versuche — weiter üben!`;}
  document.getElementById('win-score').textContent=`${moves} Versuche`;
  document.getElementById('win-stars').textContent=stars;
  document.getElementById('win-title').textContent=title;
  document.getElementById('win-msg').textContent=msg;
}

// ════════════════════════════════════════════════════════════════
// DEKORATION — Blätter am Rand des Hintergrunds
// ════════════════════════════════════════════════════════════════
(function decorate(){
  const bg = document.getElementById('jungle-bg');
  const spots = [
    { left: -4,  top: -6,  size: 150, rot: 205 },
    { left: 14,  top: -8,  size: 110, rot: 230 },
    { left: 80,  top: -7,  size: 140, rot: 320 },
    { left: 96,  top: -5,  size: 100, rot: 300 },
    { left: 4,   bottom: -8, size: 130, rot: 20 },
    { left: 26,  bottom: -10, size: 95,  rot: -15 },
    { left: 68,  bottom: -9, size: 120, rot: 10 },
    { left: 90,  bottom: -7, size: 100, rot: -25 },
  ];
  spots.forEach(s=>{
    const leaf=document.createElement('div');
    leaf.className='leaf-deco';
    leaf.style.width=s.size+'px';
    leaf.style.height=(s.size*1.3)+'px';
    leaf.style.left=s.left+'%';
    if(s.top!==undefined) leaf.style.top=s.top+'%';
    if(s.bottom!==undefined) leaf.style.bottom=s.bottom+'%';
    leaf.style.transform=`rotate(${s.rot}deg)`;
    bg.appendChild(leaf);
  });

  // leicht fallende Blätter — ein Mix aus Blatt-Glyphen und weichen Punkten für Tiefe
  const leafChars = ['🍃', '🌿'];
  const leafCount = 20;
  for (let i = 0; i < leafCount; i++) {
    const f = document.createElement('div');
    const isDot = Math.random() < 0.35;
    f.className = 'leaf-particle ' + (isDot ? 'dot' : 'glyph');
    const size = isDot ? 4 + Math.random() * 6 : 14 + Math.random() * 14;
    if (isDot) {
      f.style.width = size + 'px';
      f.style.height = size + 'px';
    } else {
      f.textContent = leafChars[Math.floor(Math.random() * leafChars.length)];
      f.style.fontSize = size + 'px';
    }
    f.style.left = Math.random() * 100 + '%';
    f.style.animationDuration = (9 + Math.random() * 12) + 's';
    f.style.animationDelay = (Math.random() * 14) + 's';
    bg.appendChild(f);
  }
})();
</script>
